{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<section class="card">

    <p class="muted">Últimos {{ limit }} candles.</p>
    <div class="chart-container">

        {{ bokeh_div | safe }}
    </div>
</section>
{% endblock %}
