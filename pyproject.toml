[project]
name = "WhatsnepsFin"
version = "0.1.0"
description = ""
authors = [
    {name = "evandro-godoy",email = "godoy@whatsneps.com.br"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "pandas (>=2.3.2,<3.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "plotly (>=6.3.0,<7.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "tensorflow (>=2.20.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "metatrader5 (>=5.0.5260,<6.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "mplfinance (>=0.12.10b0,<0.13.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "tkcalendar (>=1.6.1,<2.0.0)",
    "fastapi (>=0.115.4,<1.0.0)",
    "uvicorn[standard] (>=0.32.0,<1.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "starlette (>=1.10.0,<2.0.0)",
    "pyodbc (>=5.5.0,<6.0.0)"
]

[project.scripts]
wtnps-monitor = "src.cli:main"

[tool.poetry]
packages = [{ include = "src" }, { include = "configs" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "pytest-asyncio (>=0.25.2,<1.0.0)"
]